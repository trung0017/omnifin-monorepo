name: OmniFin Enterprise MLOps & Microservices CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Giai đoạn 1: Kiểm tra Cú pháp Mã nguồn (Linting & Code Quality)
  code-quality-and-lint:
    name: "Stage 1: Code Linting & Syntax Check"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run Flake8 Code Inspection
        run: |
          # Loại trừ toàn bộ các môi trường ảo (*.venv*) và thư viện thứ 3 để tránh RecursionError
          flake8 . --exclude="*.venv*,node_modules,.git,__pycache__" --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --exclude="*.venv*,node_modules,.git,__pycache__" --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  # Giai đoạn 2: Kiểm tra Cấu trúc & Liên thông Microservices
  microservices-health-audit:
    name: "Stage 2: Microservices Audit & Connectivity"
    needs: code-quality-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Connectivity Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx

      - name: Audit Service Connectivity Script
        run: |
          python scripts/verify_services.py || echo "Audit completed with connectivity warnings."

  # Giai đoạn 3: Huấn luyện Mô hình AI & Ghi Vết MLOps (MLflow Logging)
  mlops-model-training:
    name: "Stage 3: MLOps Model Training & MLflow Registry"
    needs: code-quality-and-lint
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install MLOps Stack
        run: |
          python -m pip install --upgrade pip
          pip install mlflow pydantic-settings qdrant-client langchain numpy

      - name: Execute Model Training & MLflow Logging
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI || 'http://127.0.0.1:5000' }}
        run: |
          echo "Kích hoạt tiến trình Train Model và đồng bộ tham số hiệu năng (Accuracy, F1-Score)..."
          python scripts/train_model.py

  # Giai đoạn 4: Đóng gói & Lưu trữ Artifacts (CD Delivery)
  package-and-upload-artifacts:
    name: "Stage 4: Package & Upload Model Artifacts"
    needs: mlops-model-training
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Upload Model Artifact
        uses: actions/upload-artifact@v4
        with:
          name: omnifin-ai-model
          path: services/ai-service/app/models/
          retention-days: 1

  # Giai đoạn 5: Tự động Build & Deploy Web Admin Dashboard lên GitHub Pages
  deploy-web-admin-gh-pages:
    name: "Stage 5: Build & Deploy Web Admin to GitHub Pages"
    needs: code-quality-and-lint
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: "pages"
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies & Build Web Admin
        env:
          GITHUB_PAGES: 'true'
        run: |
          cd apps/web-admin
          npm install
          npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'apps/web-admin/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
